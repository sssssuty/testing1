<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIVA Gallery</title>
  <link rel="icon" href="../assets/favicon/favicon.png" type="image/png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      user-select: none;
      -webkit-user-select: none;
    }

    .gallery {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .slide-area {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
      padding: 0 80px;
    }

    .slide {
      width: 100%;
      height: 100%;
      background-repeat: no-repeat;
      background-position: center;
      background-size: contain;
      -webkit-user-drag: none;
      user-drag: none;
    }

    .slide-shield {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 80px;
      right: 80px;
      z-index: 1;
    }

    .controls {
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 2rem;
      padding-bottom: 1.5rem;
      position: relative;
      z-index: 2;
    }

    .controls button {
      background: none;
      border: none;
      color: #fff;
      font-size: 2rem;
      cursor: pointer;
      padding: 0.5rem 1rem;
      line-height: 1;
      user-select: none;
    }

    .controls button:hover {
      opacity: 0.7;
    }

    .controls button:disabled {
      opacity: 0.25;
      cursor: default;
    }

    .view-video {
      display: none;
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      z-index: 2;
      padding: 0.6rem 1.2rem;
      background: #fff;
      color: #000;
      text-decoration: none;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.95rem;
      border: none;
      cursor: pointer;
      user-select: none;
    }

    .view-video.visible {
      display: block;
    }

    .view-video:hover {
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <div class="gallery">
    <div class="slide-area">
      <div id="slide" class="slide" role="img" aria-hidden="true"></div>
      <div class="slide-shield" aria-hidden="true"></div>
    </div>
    <nav class="controls" aria-label="Gallery navigation">
      <button type="button" id="prev" aria-label="Previous">&#8592;</button>
      <button type="button" id="next" aria-label="Next">&#8594;</button>
    </nav>
  </div>
  <a
    id="view-video"
    class="view-video"
    href="https://www.youtube.com/watch?v=aF2ltvG9vNE"
    target="_blank"
    rel="noopener noreferrer"
  >View Video</a>

  <script>
    const TOTAL = 21;
    const VIDEO_SLIDE = 20;
    const EXT = '.jpg';
    let current = 1;

    const slide = document.getElementById('slide');
    const prev = document.getElementById('prev');
    const next = document.getElementById('next');
    const viewVideo = document.getElementById('view-video');

    function slidePath(n) {
      return 'AIVA_' + n + EXT;
    }

    function update() {
      slide.style.backgroundImage = 'url("' + slidePath(current) + '")';
      prev.disabled = current === 1;
      next.disabled = current === TOTAL;
      viewVideo.classList.toggle('visible', current === VIDEO_SLIDE);
    }

    prev.addEventListener('click', () => {
      if (current > 1) {
        current--;
        update();
      }
    });

    next.addEventListener('click', () => {
      if (current < TOTAL) {
        current++;
        update();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' && current > 1) {
        current--;
        update();
      } else if (e.key === 'ArrowRight' && current < TOTAL) {
        current++;
        update();
      }
    });

    document.addEventListener('contextmenu', (e) => e.preventDefault());
    document.addEventListener('dragstart', (e) => e.preventDefault());

    update();
  </script>
</body>
</html>
